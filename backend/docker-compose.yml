services:
  postgres:
    image: postgres:16-alpine
    container_name: nagrik-setu-postgres
    environment:
      POSTGRES_USER: nagrik
      POSTGRES_PASSWORD: nagrik_password
      POSTGRES_DB: nagrik_setu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagrik -d nagrik_setu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
